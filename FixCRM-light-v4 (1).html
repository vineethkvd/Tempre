
@{
    ViewData["Title"] = "Add New Accounts";
    Layout = "~/Views/Shared/_Layout.cshtml";
}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add New Accounts</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="~/css/index.css" />
    <script src="~/js/site.js"></script>

    <style>
        body {
            background-color: #d7d7d7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .main-container-css {
            width: 100%;
            max-width: 950px;
            margin: 0 auto;
            background-color: #e5e5e5;
            border: 1px solid #a0a0a0;
            padding-bottom: 30px;
        }

        .header-title {
            background-color: #b6b6b6;
            color: #000000;
            text-align: center;
            font-weight: bold;
            font-size: 15px;
            padding: 8px;
            margin-bottom: 30px;
            border-bottom: 1px solid #a0a0a0;
        }

        .form-label {
            text-align: right;
            font-size: 12px;
            color: #000000;
            padding-top: 4px;
            margin-bottom: 0;
        }

        .form-control-sm, .form-select-sm {
            border: 1px solid #a0a0a0;
            border-radius: 0px;
            padding: 2px 4px;
            font-size: 12px;
            width: 100%;
            background-color: #ffffff;
            height: 24px;
        }

        .btn-action {
            background-color: #e0e0e0;
            color: #000000;
            border: 1px solid #a0a0a0;
            font-size: 12px;
            font-weight: bold;
            padding: 4px 25px;
            min-width: 80px;
        }

        .btn-action:hover {
            background-color: #d0d0d0;
        }

        /* Adjust Select2 to match tight desktop design */
        .select2-container .select2-selection--single {
            height: 24px !important;
            border: 1px solid #a0a0a0 !important;
            border-radius: 0px !important;
        }
        
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            line-height: 22px !important;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="main-container-css">
        
        <div class="header-title">Add New Accounts</div>

        <div class="container-fluid px-4">
            <!-- Row 1: Account Nature & Account Schedule -->
            <div class="row mb-3 align-items-center">
                <div class="col-md-2">
                    <label class="form-label w-100">Account Nature :</label>
                </div>
                <div class="col-md-4">
                    <select id="cmbAccNature" class="form-select-sm" onchange="cmbAccNature_SelectedIndexChanged()">
                        <option value="-1">------SELECT------</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label w-100">Account Schedule :</label>
                </div>
                <div class="col-md-4">
                    <select id="cmbAccShedule" class="form-select-sm" onchange="cmbAccShedule_SelectedIndexChanged()">
                        <option value="-1">------SELECT------</option>
                    </select>
                </div>
            </div>

            <!-- Row 2: Sub Schedule & Sub Type -->
            <div class="row mb-3 align-items-center">
                <div class="col-md-2">
                    <label class="form-label w-100">Sub Schedule :</label>
                </div>
                <div class="col-md-4">
                    <select id="cmbSubShedule" class="form-select-sm" onchange="cmbSubShedule_SelectedIndexChanged()">
                        <option value="-1">------SELECT------</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label w-100">Sub Type :</label>
                </div>
                <div class="col-md-4">
                    <select id="cmbSubType" class="form-select-sm">
                        <option value="-1">------SELECT------</option>
                    </select>
                </div>
            </div>

            <!-- Row 3: New Account Name & Account No -->
            <div class="row mb-4 align-items-center">
                <div class="col-md-2">
                    <label class="form-label w-100">New Account Name :</label>
                </div>
                <div class="col-md-4">
                    <input type="text" id="txtAccName" class="form-control-sm text-uppercase" maxlength="100" onkeypress="return validateAccName(event)" />
                </div>
                <div class="col-md-2">
                    <label class="form-label w-100">Account No :</label>
                </div>
                <div class="col-md-4">
                    <input type="text" id="valtxtAcountNo" class="form-control-sm" maxlength="5" oninput="this.value = this.value.replace(/[^0-9]/g, '')" />
                </div>
            </div>

            <!-- Row 4: Buttons -->
            <div class="row mt-5">
                <div class="col-md-12 text-center">
                    <button type="button" class="btn btn-action me-3" onclick="btnConfirm_Click()">Confirm</button>
                    <button type="button" class="btn btn-action" onclick="window.history.back()">Exit</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const root = '@ViewData["root"]';
        const usr_id = '@ViewData["EmpCode"]';
        const firm_id = '@ViewData["FirmID"]';
        var extractedUsrId = usr_id ? usr_id.split('!')[0] : "";

        $(document).ready(function() {
            $('#cmbAccNature').select2();
            $('#cmbAccShedule').select2();
            $('#cmbSubShedule').select2();
            $('#cmbSubType').select2();

            FillAccNature();
        });
        
        function postApiUrl() {
            if (document.location.hostname === "localhost") {
                return "/VEFAcc/postAPIData";
            }
            return "/" + root + "/VEFAcc/postAPIData".replace(/\/+/g, "/");
        }

        function FillAccNature() {
            var reqData = "ADD_ACC_GET_NATURE^1";
            $.ajax({
                type: "POST",
                url: postApiUrl(),
                data: { datas: reqData },
                success: function(res) {
                    var data = typeof res === "string" ? JSON.parse(res) : res;
                    var $cmb = $('#cmbAccNature');
                    $cmb.empty().append('<option value="-1">------SELECT------</option>');
                    if (data && data.length > 0) {
                        data.forEach(function(row) {
                            var val = row.NATURE_NO || row.nature_no;
                            var text = row.ACCNATURE_NAME || row.accnature_name;
                            $cmb.append('<option value="' + val + '">' + text + '</option>');
                        });
                    }
                }
            });
        }

        function cmbAccNature_SelectedIndexChanged() {
            var natureNo = $('#cmbAccNature').val();
            $('#cmbAccShedule').empty().append('<option value="-1">------SELECT------</option>').trigger('change');
            $('#cmbSubShedule').empty().append('<option value="-1">------SELECT------</option>').trigger('change');
            $('#cmbSubType').empty().append('<option value="-1">------SELECT------</option>').trigger('change');

            if (natureNo !== "-1" && natureNo !== "") {
                var reqData = "ADD_ACC_GET_SCHEDULE^" + natureNo + "^1";
                $.ajax({
                    type: "POST",
                    url: postApiUrl(),
                    data: { datas: reqData },
                    success: function(res) {
                        var data = typeof res === "string" ? JSON.parse(res) : res;
                        var $cmb = $('#cmbAccShedule');
                        if (data && data.length > 0) {
                            data.forEach(function(row) {
                                var val = row.SCHEDULE_NO || row.schedule_no;
                                var text = row.SCHEDULE_NAME || row.schedule_name;
                                $cmb.append('<option value="' + val + '">' + text + '</option>');
                            });
                        }
                    }
                });
            }
        }

        function cmbAccShedule_SelectedIndexChanged() {
            var scheduleNo = $('#cmbAccShedule').val();
            $('#cmbSubShedule').empty().append('<option value="-1">------SELECT------</option>').trigger('change');
            $('#cmbSubType').empty().append('<option value="-1">------SELECT------</option>').trigger('change');

            if (scheduleNo !== "-1" && scheduleNo !== "") {
                var reqData = "ADD_ACC_GET_SUBSCHEDULE^" + scheduleNo + "^1";
                $.ajax({
                    type: "POST",
                    url: postApiUrl(),
                    data: { datas: reqData },
                    success: function(res) {
                        var data = typeof res === "string" ? JSON.parse(res) : res;
                        var $cmb = $('#cmbSubShedule');
                        if (data && data.length > 0) {
                            data.forEach(function(row) {
                                var val = row.SUBSCHEDULE_NO || row.subschedule_no;
                                var text = row.SUBSCHEDULE_NAME || row.subschedule_name;
                                $cmb.append('<option value="' + val + '">' + text + '</option>');
                            });
                        }
                    }
                });
            }
        }

        function cmbSubShedule_SelectedIndexChanged() {
            var subScheduleNo = $('#cmbSubShedule').val();
            $('#cmbSubType').empty().append('<option value="-1">------SELECT------</option>').trigger('change');

            if (subScheduleNo !== "-1" && subScheduleNo !== "") {
                var reqData = "ADD_ACC_GET_SUBTYPE^1";
                $.ajax({
                    type: "POST",
                    url: postApiUrl(),
                    data: { datas: reqData },
                    success: function(res) {
                        var data = typeof res === "string" ? JSON.parse(res) : res;
                        var $cmb = $('#cmbSubType');
                        if (data && data.length > 0) {
                            data.forEach(function(row) {
                                var val = row.STATUS_ID || row.status_id;
                                var text = row.SUBTYPE || row.subtype;
                                $cmb.append('<option value="' + val + '">' + text + '</option>');
                            });
                        }
                    }
                });
            }
        }

        // ==========================================
        // Client-Side Validations
        // ==========================================

        function validateAccName(e) {
            var regex = new RegExp("^[a-zA-Z0-9\\s/\\-&()]+$");
            var key = String.fromCharCode(!e.charCode ? e.which : e.charCode);

            if (e.charCode === 0 || e.keyCode === 8 || e.keyCode === 46) return true;

            if (!regex.test(key)) {
                e.preventDefault();
                Swal.fire("Warning", "Invalid Symbol: " + key, "warning");
                return false;
            }
            return true;
        }

        function IsValidAll() {
            var nature = $('#cmbAccNature').val();
            var schedule = $('#cmbAccShedule').val();
            var subSchedule = $('#cmbSubShedule').val();
            var subType = $('#cmbSubType').val();
            var accName = $('#txtAccName').val().trim();
            var accNo = $('#valtxtAcountNo').val().trim();

            if (!nature || nature == "-1") {
                Swal.fire("Warning", "Select Account Nature.", "warning");
                return false;
            }
            if (!schedule || schedule == "-1") {
                Swal.fire("Warning", "Select Account Shedule.", "warning");
                return false;
            }
            if (!subSchedule || subSchedule == "-1") {
                Swal.fire("Warning", "Select Account Sub Shedule.", "warning");
                return false;
            }
            if (!subType || subType == "-1") {
                Swal.fire("Warning", "Select Sub Type.", "warning");
                return false;
            }
            if (accName === "") {
                Swal.fire("Warning", "Enter New Account Name.", "warning");
                return false;
            }
            if (accNo === "") {
                Swal.fire("Warning", "Enter Account No.", "warning");
                return false;
            }
            if (accNo.length !== 5) {
                Swal.fire("Warning", "Enter 5 digit Account No.", "warning");
                return false;
            }

            var natureFirstChar = nature.toString().substring(0, 1);
            var accNoFirstChar = accNo.toString().substring(0, 1);
            if (natureFirstChar !== accNoFirstChar) {
                Swal.fire("Warning", "Account number and Account nature are different.", "warning");
                return false;
            }

            return true;
        }

        // ==========================================
        // Server-Side Validations & Saving
        // ==========================================

        function btnConfirm_Click() {
            if (!IsValidAll()) return;

            var accName = $('#txtAccName').val().trim().toUpperCase();
            var accNo = $('#valtxtAcountNo').val().trim();

            Swal.fire({ title: "Checking Details...", text: "Please wait.", allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

            $.ajax({
                type: "POST",
                url: postApiUrl(),
                data: { datas: "ADD_ACC_CHECK_NAME^" + accName + "^1" },
                success: function(resName) {
                    var dataName = typeof resName === "string" ? JSON.parse(resName) : resName;
                    var nameCnt = dataName[0].CNT || dataName[0].cnt || 0;

                    if (nameCnt > 0) {
                        Swal.fire("Warning", "Account Name already exist.", "warning");
                        $('#txtAccName').val('');
                        return;
                    }

                    $.ajax({
                        type: "POST",
                        url: postApiUrl(),
                        data: { datas: "ADD_ACC_CHECK_ACCNO^" + accNo + "^1" },
                        success: function(resNo) {
                            var dataNo = typeof resNo === "string" ? JSON.parse(resNo) : resNo;
                            var noCnt = dataNo[0].CNT || dataNo[0].cnt || 0;

                            if (noCnt > 0) {
                                Swal.fire("Warning", "Account Number already exist.", "warning");
                                $('#valtxtAcountNo').val('');
                                return;
                            }

                            var nature = $('#cmbAccNature').val();
                            var schedule = $('#cmbAccShedule').val();
                            var subSchedule = $('#cmbSubShedule').val();
                            var subType = $('#cmbSubType').val();

                            $.ajax({
                                type: "POST",
                                url: postApiUrl(),
                                data: { datas: "ADD_ACC_CHECK_PROFILE^" + nature + "~" + schedule + "~" + subSchedule + "^1" },
                                success: function(resProf) {
                                    executeInsert(accNo, accName, subSchedule, schedule, nature, firm_id, subType, extractedUsrId);
                                },
                                error: function() {
                                    Swal.fire("Error", "Validation failed on server.", "error");
                                }
                            });
                        }
                    });
                }
            });
        }

        function executeInsert(accNo, accName, subSchedule, schedule, nature, firmId, subType, userId) {
            var reqData = "ADD_ACC_INSERT_NEW^" + accNo + "~" + accName + "~" + subSchedule + "~" + schedule + "~" + nature + "~" + firmId + "~" + subType + "~" + userId + "^1";

            $.ajax({
                type: "POST",
                url: postApiUrl(),
                data: { datas: reqData },
                success: function(res) {
                    var data = typeof res === "string" ? JSON.parse(res) : res;
                    if (data && data.length > 0) {
                        var status = data[0].STATUS || data[0].status;

                        if (status == 1 || status == "1") {
                            Swal.fire("New Accounts", "Saved Successfully.", "success").then(() => {
                                ClearAllControls();
                            });
                        } else {
                            Swal.fire("New Accounts", "Failed. Please Try Again Later", "warning");
                        }
                    } else {
                        Swal.fire("Error", "Unexpected error occurred while performing this operation!", "error");
                    }
                },
                error: function() {
                    Swal.fire("Error", "Server connection failed.", "error");
                }
            });
        }

        function ClearAllControls() {
            $('#cmbAccNature').val('-1').trigger('change');
            $('#cmbAccShedule').empty().append('<option value="-1">------SELECT------</option>').trigger('change');
            $('#cmbSubShedule').empty().append('<option value="-1">------SELECT------</option>').trigger('change');
            $('#cmbSubType').empty().append('<option value="-1">------SELECT------</option>').trigger('change');

            $('#txtAccName').val('');
            $('#valtxtAcountNo').val('');
        }
    </script>
</body>
</html>
