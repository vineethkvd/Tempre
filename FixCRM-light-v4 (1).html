@{
    ViewData["Title"] = "Hostel Assets Status";
    Layout = "~/Views/Shared/_Layout.cshtml"; // Ensure this matches your project layout
}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HOSTEL ASSETS</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="~/css/index.css" />
    <script src="~/js/site.js"></script>

    <style>
        body {
            background-color: #e9ecef;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .main-container-css {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            border: 2px solid #000000;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }

        .header-title {
            text-align: left;
            font-weight: bold;
            font-size: 24px;
            color: #000080; /* Navy */
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #000000;
        }

        .table-custom {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
            border: 1px solid #cccccc;
        }

        .table-custom th {
            background-color: #006699 !important;
            color: #ffffff !important;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            padding: 10px;
            border: 1px solid #cccccc;
        }

        .table-custom td {
            border: 1px solid #cccccc;
            padding: 6px 10px;
            vertical-align: middle;
            font-size: 13px;
            color: #000066;
            font-family: Cambria, Georgia, serif;
        }
        
        .table-custom tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .form-select-sm {
            border: 1px solid #999;
            border-radius: 4px;
            padding: 4px 24px 4px 8px;
            font-size: 13px;
            min-width: 100px;
        }

        .btn-confirm {
            background-color: #e0e0e0;
            color: #000;
            border: 1px solid #000;
            font-weight: bold;
            font-family: 'Times New Roman', Times, serif;
            min-width: 100px;
        }

        .btn-confirm:hover {
            background-color: #cccccc;
        }
    </style>
</head>
<body>
    <div class="main-container-css">

        <div class="header-title">HOSTAL ASSETS</div>

        <div class="table-responsive mb-4">
            <table class="table-custom" id="grdApprove">
                <thead>
                    <tr>
                        <th>FLAT NO</th>
                        <th>FLAT NAME</th>
                        <th>ITEM NAME</th>
                        <th>ITEM NO</th>
                        <th>MAKE NAME</th>
                        <th>COUNT</th>
                        <th>TOTAL PRICE</th>
                        <th>ENTER DATE</th>
                        <th>EMPLOYEE CODE</th>
                        <th>Working</th>
                        <th>Available</th>
                    </tr>
                </thead>
                <tbody id="grdApproveBody">
                    <tr>
                        <td colspan="11" class="text-center text-muted py-4">Loading Assets...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="text-center mt-4">
            <button type="button" class="btn btn-sm btn-confirm px-4 py-2 me-3" onclick="btn_Confirm_Click()">Confirm</button>
            <button type="button" class="btn btn-sm btn-confirm px-4 py-2" onclick="btn_Exit_Click()">Exit</button>
        </div>

    </div>

    <script>
        const root = '@ViewData["root"]';
        const usr_id = '@ViewData["EmpCode"]'; // Assuming this maps to user_id
        const firm_id = '@ViewData["FirmID"]';

        $(document).ready(function () {
            loadAssetData();
        });

        function postApiUrl() {
            return window.location.hostname === "localhost"
                ? "/Others/postAPIData"
                : `/${root}/Others/postAPIData`.replace(/\/+/g, "/");
        }

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param) || "";
        }

        function loadAssetData() {
            var empCode = getQueryParam("empcode");
            var choice = getQueryParam("Choice");
            var fromDt = getQueryParam("fromdt") || " ";
            var toDt = getQueryParam("todt") || " ";

            if (!empCode) {
                Swal.fire("Error", "Missing Employee Code.", "error").then(() => window.close());
                return;
            }

            // Split by $ to align with your newer delimiter logic if '~' causes collisions
            var reqData = "HOSTEL_VERIFY_GET_ASSET_STATUS$" + empCode + "$" + choice + "$" + fromDt + "$" + toDt + "$" + firm_id + "^1";

            $.ajax({
                type: "POST",
                url: postApiUrl(),
                data: { datas: reqData },
                success: function (res) {
                    var data = typeof res === "string" ? JSON.parse(res) : res;
                    var tbody = "";

                    if (data && data.length > 0 && !data[0].EMPTY_STATUS && !data[0].empty_status) {
                        data.forEach(function (row, index) {
                            var flatNo = row.FLAT_NO || row.flat_no || "";
                            var flatName = row.FLAT_NAME || row.flat_name || "";
                            var itemName = row.ITEM_NAME || row.item_name || "";
                            var itemId = row.ITEM_ID || row.item_id || "";
                            var makeName = row.MAKE_NAME || row.make_name || "";
                            var totalCount = row.TOTAL_COUNT || row.total_count || "0";
                            var totalPrice = row.TOTAL_PRICE || row.total_price || "0";
                            var enterDate = row.ENTER_DATE || row.enter_date || "";
                            var userCode = row.USER_CODE || row.user_code || "";

                            tbody += `<tr class="asset-row" data-flatno="${flatNo}" data-itemno="${itemId}" data-emp="${userCode}">
                                        <td class="text-center">${flatNo}</td>
                                        <td>${flatName}</td>
                                        <td>${itemName}</td>
                                        <td class="text-center">${itemId}</td>
                                        <td>${makeName}</td>
                                        <td class="text-center">${totalCount}</td>
                                        <td class="text-end">${totalPrice}</td>
                                        <td class="text-center">${enterDate}</td>
                                        <td class="text-center">${userCode}</td>
                                        <td class="text-center">
                                            <select class="form-select form-select-sm ddl-working">
                                                <option value="0">SELECT</option>
                                                <option value="1">YES</option>
                                                <option value="2">NO</option>
                                            </select>
                                        </td>
                                        <td class="text-center">
                                            <select class="form-select form-select-sm ddl-available">
                                                <option value="0">SELECT</option>
                                                <option value="1">YES</option>
                                                <option value="2">NO</option>
                                            </select>
                                        </td>
                                      </tr>`;
                        });
                        $('#grdApproveBody').html(tbody);
                    } else {
                        Swal.fire({
                            title: 'No Data',
                            text: 'No data found for this selection.',
                            icon: 'warning',
                            confirmButtonText: 'OK'
                        }).then(() => {
                            btn_Exit_Click();
                        });
                    }
                },
                error: function () {
                    $('#grdApproveBody').html(`<tr><td colspan="11" class="text-center text-danger py-4">Failed to load data from server.</td></tr>`);
                    Swal.fire("Error", "Server connection failed.", "error");
                }
            });
        }

        function checkGridFill() {
            var isValid = true;
            $('.asset-row').each(function () {
                var workVal = $(this).find('.ddl-working').val();
                var avaiVal = $(this).find('.ddl-available').val();
                
                if (workVal === "0" || avaiVal === "0") {
                    isValid = false;
                    return false; // Break loop
                }
            });
            return isValid;
        }

        function btn_Confirm_Click() {
            if ($('.asset-row').length === 0) {
                Swal.fire("Warning", "No records to confirm.", "warning");
                return;
            }

            // Legacy check
            if (!checkGridFill()) {
                Swal.fire("Warning", "Choose file (Please select Working/Available for all rows).", "warning");
                return;
            }

            Swal.fire({
                title: 'Are you sure?',
                text: "Are you sure to approve the selected records...",
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#3085d6',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Yes'
            }).then((result) => {
                if (result.isConfirmed) {
                    processSave();
                }
            });
        }

        function processSave() {
            var outputString = "";
            var extractedUsrId = usr_id.split('!')[0]; // Matches logic in legacy code: usr_id(0)

            $('.asset-row').each(function () {
                var fno = $(this).data("flatno");
                var ino = $(this).data("itemno");
                var emp = $(this).data("emp");
                
                var work = $(this).find('.ddl-working').val();
                var avai = $(this).find('.ddl-available').val();

                // Format: fno~ino~work~avai~EMP~usr_id(0)!
                outputString += fno + "~" + ino + "~" + work + "~" + avai + "~" + emp + "~" + extractedUsrId + "!";
            });

            Swal.fire({ title: "Updating...", text: "Please wait.", allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

            // Ensure you use '$' if '~' causes array shifting collisions in your PL/SQL splitstr
            var safeOutput = outputString.replace(/~/g, '$');
            var reqData = "HOSTEL_VERIFY_SAVE_ASSET_STATUS$" + safeOutput + "^1";

            $.ajax({
                type: "POST",
                url: postApiUrl(),
                data: { datas: reqData },
                success: function (res) {
                    var data = typeof res === "string" ? JSON.parse(res) : res;
                    if (data && data.length > 0) {
                        var status = data[0].STATUS || data[0].status;
                        var msg = data[0].RES || data[0].res || "Data updated .....";
                        
                        Swal.fire("Success", msg, "success").then(() => {
                            window.close(); // Legacy behavior closed the popup window on success
                        });
                    } else {
                        Swal.fire("Error", "Failed to update records.", "error");
                    }
                },
                error: function () {
                    Swal.fire("Error", "Server connection failed.", "error");
                }
            });
        }

        function btn_Exit_Click() {
            // If opened as a popup, close it. Otherwise, go back to main verification page.
            if (window.opener && !window.opener.closed) {
                window.close();
            } else {
                var redirectUrl = window.location.hostname === "localhost"
                    ? `/Others/amahverification`
                    : `/${root}/Others/amahverification`.replace(/\/+/g, "/");
                window.location.href = redirectUrl;
            }
        }
    </script>
</body>
</html>
