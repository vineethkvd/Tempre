@{
    ViewData["Title"] = "CancelHostel";
    Layout = "~/Views/Shared/_Layout.cshtml";
}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cancel Hostel</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
    <link rel="stylesheet" href="~/css/index.css" />

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.15.10/dist/sweetalert2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            background-color: #e9ecef;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .main-container-css {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background-color: #f4f6f9;
            padding: 20px;
            border: 1px solid #ccc;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        .table-custom {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
            border: 1px solid #b0bec5;
        }

        .table-custom th {
            background-color: #85c1e9 !important;
            color: #000000;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            padding: 8px;
            border: 1px solid #b0bec5;
            text-decoration: underline;
        }

        .table-custom td {
            border: 1px solid #b0bec5;
            padding: 8px 15px;
            vertical-align: middle;
            font-size: 14px;
        }

        .label-cell {
            text-align: right;
            font-weight: bold;
            width: 35%;
            background-color: #fdfdfd;
        }

        .input-cell {
            width: 65%;
        }

        .form-control-sm, .form-select-sm {
            border: 1px solid #999;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 13px;
            width: 80%;
            background-color: #f1f8ff;
        }
        
        .readonly-field {
            background-color: #e9ecef !important;
            cursor: not-allowed;
        }

        .btn-confirm {
            background-color: #2c3e50;
            color: white;
            border: none;
            width: 120px;
        }

        .btn-exit {
            background-color: #d81b60;
            color: white;
            border: none;
            width: 120px;
        }
    </style>
</head>
<body>
    <div class="main-container-css">
        <input type="hidden" id="hidVal" value="0" />
        <input type="hidden" id="hidFlatNo" />

        <table class="table-custom">
            <thead>
                <tr>
                    <th colspan="2">CANCEL HOSTEL</th>
                </tr>
            </thead>
            <tbody>
                <tr id="rowYesNo">
                    <td class="text-center" style="width: 50%;">
                        <input class="form-check-input me-2" type="radio" name="cancelType" id="radProposal" value="1" onchange="stayInHostel()">
                        <label class="form-check-label fw-bold" for="radProposal">Proposal Cancel</label>
                    </td>
                    <td class="text-center" style="width: 50%;">
                        <input class="form-check-input me-2" type="radio" name="cancelType" id="radHostel" value="2" onchange="stayInHostel()">
                        <label class="form-check-label fw-bold" for="radHostel">Cancel Hostel</label>
                    </td>
                </tr>

                <tr id="rowSearch" style="display:none;">
                    <td class="text-center">
                        <input class="form-check-input me-2" type="radio" name="searchType" id="radNumber" onchange="searchFlat()">
                        <label class="form-check-label fw-bold" for="radNumber">Search By Flat No</label>
                    </td>
                    <td class="text-center">
                        <input class="form-check-input me-2" type="radio" name="searchType" id="radName" onchange="searchFlatName()">
                        <label class="form-check-label fw-bold" for="radName">Search By Flat Name</label>
                    </td>
                </tr>

                <tr id="row1" style="display:none;">
                    <td class="label-cell">Flat No :</td>
                    <td class="input-cell">
                        <input type="text" id="txtFlatNoSearch" class="form-control-sm" maxlength="5" oninput="this.value = this.value.replace(/[^0-9]/g, '')" onchange="getFlatNoDetails()" />
                    </td>
                </tr>

                <tr id="row2" style="display:none;">
                    <td class="label-cell">Flat Name :</td>
                    <td class="input-cell">
                        <select id="cmbFlatName" class="form-select-sm" onchange="getFlatNameDetails()"></select>
                    </td>
                </tr>

                <tr class="detail-row" style="display:none;">
                    <td class="label-cell">Branch Name :</td>
                    <td class="input-cell">
                        <input type="text" id="txtBranchName" class="form-control-sm readonly-field" readonly />
                    </td>
                </tr>

                <tr class="detail-row" id="row8" style="display:none;">
                    <td class="label-cell">Flat No :</td>
                    <td class="input-cell">
                        <input type="text" id="txtFlNoDisplay" class="form-control-sm readonly-field" readonly />
                    </td>
                </tr>

                <tr class="detail-row" id="row4" style="display:none;">
                    <td class="label-cell">Flat Name :</td>
                    <td class="input-cell">
                        <input type="text" id="txtFlatNameDisplay" class="form-control-sm readonly-field" readonly />
                    </td>
                </tr>

                <tr class="detail-row" style="display:none;">
                    <td class="label-cell">Owner Name :</td>
                    <td class="input-cell">
                        <input type="text" id="txtOwner" class="form-control-sm readonly-field" readonly />
                    </td>
                </tr>

                <tr class="detail-row" id="row9" style="display:none;">
                    <td class="text-center" colspan="2" style="padding: 10px 0;">
                        <span class="fw-bold me-2">Advance :</span>
                        <input type="text" id="txtAdvanceAmt" class="form-control-sm readonly-field d-inline-block me-5" style="width: 25%;" readonly />
                        
                        <span class="fw-bold me-2">Rent :</span>
                        <input type="text" id="txtRentAmt" class="form-control-sm d-inline-block" style="width: 25%;" />
                    </td>
                </tr>

                <tr class="detail-row" id="row6" style="display:none;">
                    <td class="text-center" colspan="2" style="padding: 10px 0;">
                        <span class="fw-bold me-2">Agreement From :</span>
                        <input type="text" id="txtFrom" class="form-control-sm readonly-field d-inline-block me-4" style="width: 25%;" readonly />
                        
                        <span class="fw-bold me-2">Agreement To :</span>
                        <input type="text" id="txtTo" class="form-control-sm readonly-field d-inline-block" style="width: 25%;" readonly />
                    </td>
                </tr>

                <tr class="detail-row" id="row10" style="display:none;">
                    <td class="label-cell">Pending Days :</td>
                    <td class="input-cell">
                        <input type="text" id="txtPendDays" class="form-control-sm readonly-field" readonly />
                    </td>
                </tr>

                <tr class="detail-row" id="row7" style="display:none;">
                    <td colspan="2" class="text-center" style="padding: 15px;">
                        <button type="button" class="btn btn-confirm fw-bold px-4 me-4" id="btnConfirm" onclick="btnConfirmOnclick()">CONFIRM</button>
                        <button type="button" class="btn btn-exit fw-bold px-4" onclick="window.history.back()">EXIT</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const root = '@ViewData["root"]';
        const usr_id = '@ViewData["EmpCode"]';
        const firmId = '@ViewData["FirmID"]';
        const branch_id = '@ViewData["BrID"]';

        function postApiUrl() {
            return window.location.hostname === "localhost"
                ? "/Others/postAPIData"
                : `/${root}/Others/postAPIData`.replace(/\/+/g, "/");
        }

        function stayInHostel() {
            if ($('#radProposal').is(':checked')) {
                $('#hidVal').val("1");
            } else if ($('#radHostel').is(':checked')) {
                $('#hidVal').val("2");
            }

            $('#rowSearch').show();
            $('.detail-row').hide();
            $('#row1, #row2').hide();
            $('#radNumber, #radName').prop('checked', false);
        }

        function searchFlat() {
            $('#row1').show();
            $('#row2').hide();
            $('.detail-row').hide();
            $('#txtFlatNoSearch').val("");
        }

        function searchFlatName() {
            $('#row1').hide();
            $('#row2').show();
            $('.detail-row').hide();

            var optType = $('#hidVal').val();
            var reqData = "CANCEL_HOSTEL_FILL_COMBO^" + optType + "~" + firmId  + "^1";

            $.ajax({
                type: "POST",
                url: postApiUrl(),
                data: { datas: reqData },
                success: function (res) {
                    var data = typeof res === "string" ? JSON.parse(res) : res;
                    var $cmb = $('#cmbFlatName');
                    $cmb.empty();

                    if (data && data.length > 0) {
                        data.forEach(function (row) {
                            var vals = Object.values(row);
                            var val = vals[0];
                            var text = vals[1];
                            $cmb.append(`<option value="${val}">${text}</option>`);
                        });
                    } else {
                        Swal.fire("Info", "No Hostel to Cancel", "info");
                    }
                }
            });
        }

        function getFlatNoDetails() {
            var flatNo = $('#txtFlatNoSearch').val();
            if (flatNo === '') {
                Swal.fire("Warning", "Please ..Enter Flat No !!", "warning");
                return false;
            }

            var optType = $('#hidVal').val();
            var reqData = "CANCEL_HOSTEL_SEARCH_FLAT_NO^" + flatNo + "~" + optType + "~" + firmId  + "^1";
            executeSearch(reqData, optType);
        }

        function getFlatNameDetails() {
            var flatNo = $('#cmbFlatName').val();
            if (flatNo == "-1" || !flatNo) {
                Swal.fire("Warning", "Please ..Select Flat Name !!", "warning");
                return false;
            }

            var optType = $('#hidVal').val();
            var reqData = "CANCEL_HOSTEL_SEARCH_FLAT_NAME^" + flatNo + "~" + optType + "~" + firmId  + "^1";
            executeSearch(reqData, optType);
        }

        function executeSearch(reqData, optType) {
            $.ajax({
                type: "POST",
                url: postApiUrl(),
                data: { datas: reqData },
                success: function (res) {
                    var data = typeof res === "string" ? JSON.parse(res) : res;

                    if (data && data.length > 0) {
                        var row = data[0];

                        var flatName = Object.values(row)[0];
                        var flatNo = Object.values(row)[1];
                        var branchName = Object.values(row)[2];
                        var ownerName = Object.values(row)[3];
                        var advanceAmt = Object.values(row)[4];
                        var rentAmt = Object.values(row)[5];
                        var pendingDays = Object.values(row)[6];

                        $('#txtFlatNameDisplay').val(flatName);
                        $('#txtFlNoDisplay').val(flatNo);
                        $('#hidFlatNo').val(flatNo);
                        $('#txtBranchName').val(branchName);
                        $('#txtOwner').val(ownerName);
                        $('#txtAdvanceAmt').val(advanceAmt);
                        $('#txtRentAmt').val(rentAmt);

                        $('.detail-row').show();

                        if (optType === "1") {
                            $('#row10').show();
                            $('#txtPendDays').val(pendingDays);
                            $('#row6').hide();
                        } else {
                            $('#row10').hide();
                            $('#row6').show();
                            var aggFrom = Object.values(row)[7];
                            var aggTo = Object.values(row)[8];
                            $('#txtFrom').val(aggFrom ? aggFrom.split('T')[0] : '');
                            $('#txtTo').val(aggTo ? aggTo.split('T')[0] : '');
                        }

                        if ($('#radNumber').is(':checked')) {
                            $('#row8').hide();
                            $('#row4').show();
                        } else {
                            $('#row8').show();
                            $('#row4').hide();
                        }
                    } else {
                        Swal.fire("Error", "Please ..Enter Correct Flat No !!", "error");
                        $('.detail-row').hide();
                    }
                }
            });
        }

        function btnConfirmOnclick() {
            if (!$('#radProposal').is(':checked') && !$('#radHostel').is(':checked')) {
                Swal.fire("Warning", "Select Cancel Type", "warning");
                return false;
            }
            if (!$('#radNumber').is(':checked') && !$('#radName').is(':checked')) {
                Swal.fire("Warning", "Select Flat Type", "warning");
                return false;
            }
            if ($('#radName').is(':checked') && $('#cmbFlatName').val() == "-1") {
                Swal.fire("Warning", "Select Flat Name", "warning");
                return false;
            }
            if ($('#radNumber').is(':checked')) {
                var txtFlat = $('#txtFlatNoSearch').val();
                if (txtFlat === "" || txtFlat == "0") {
                    Swal.fire("Warning", "Enter Flat Number", "warning");
                    return false;
                }
            }

            var flatId = $('#hidFlatNo').val();
            var valOpt = $('#hidVal').val();

            Swal.fire({
                title: 'Are you sure?',
                text: "Do you want to confirm this cancellation?",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#2c3e50',
                cancelButtonColor: '#d81b60',
                confirmButtonText: 'Yes, Confirm!'
            }).then((result) => {
                if (result.isConfirmed) {
                    var reqData = "Proc_cancel_hostel^" + flatId + "~" + valOpt + "^1";
                    
                    $.ajax({
                        type: "POST",
                        url: postApiUrl(),
                        data: { datas: reqData },
                        success: function (res) {
                            var data = typeof res === "string" ? JSON.parse(res) : res;
                            if (data && data.length > 0) {
                                var status = data[0].STATUS || data[0].status;
                                var msg = data[0].RES || data[0].res || "Cannot Cancel This Hostel";
                                
                                if (status == 1) {
                                    Swal.fire("Success", "Hostel Canceled", "success").then(() => {
                                        window.history.back();
                                    });
                                } else {
                                    Swal.fire("Error", msg, "error").then(() => {
                                        window.history.back();
                                    });
                                }
                            } else {
                                Swal.fire("Error", "Failed to process cancellation.", "error");
                            }
                        },
                        error: function () {
                            Swal.fire("Error", "Server connection failed.", "error");
                        }
                    });
                }
            });
        }
    </script>
</body>
</html>
