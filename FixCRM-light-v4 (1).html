
@{
    ViewData["Title"] = "CancelHostel";
    Layout = "~/Views/Shared/_Layout.cshtml";
}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cancel Hostel</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
    <link rel="stylesheet" href="~/css/index.css" />

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.15.10/dist/sweetalert2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            background-color: #f7ebdb;
            font-family: 'Times New Roman', Times, serif;
            color: #000000;
            margin: 0;
            padding: 10px;
        }

        .main-container-css {
            width: 950px;
            max-width: 1200px;
            margin: 20px auto;
            background-color: #fcf1df;
            padding: 20px;
            border: 2px solid #660000;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #660033;
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-decoration: underline;
            background-color: #ccccff;
            padding: 5px;
            border: 1px solid #990063;
        }

        .form-label {
            font-weight: bold;
            font-size: 14px;
        }

        .detail-row {
            border: 1px solid #999999;
            padding: 10px;
            margin-bottom: 5px;
            background-color: #ffffff;
        }

        .readonly-field {
            background-color: #e9ecef;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="main-container-css">
        <div class="section-title">CANCEL HOSTEL</div>

        <input type="hidden" id="hidVal" value="0" />
        <input type="hidden" id="hidFlatNo" />

        <div class="row mb-3 p-2" style="border: 1px solid #999999; background-color: #fff;" id="rowYesNo">
            <div class="col-md-6 text-center">
                <input class="form-check-input" type="radio" name="cancelType" id="radProposal" value="1" onchange="stayInHostel()">
                <label class="form-check-label fw-bold" for="radProposal">Proposal Cancel</label>
            </div>
            <div class="col-md-6 text-center">
                <input class="form-check-input" type="radio" name="cancelType" id="radHostel" value="2" onchange="stayInHostel()">
                <label class="form-check-label fw-bold" for="radHostel">Cancel Hostel</label>
            </div>
        </div>

        <div class="row mb-3 p-2" style="border: 1px solid #999999; background-color: #fff; display:none;" id="rowSearch">
            <div class="col-md-6 text-center">
                <input class="form-check-input" type="radio" name="searchType" id="radNumber" onchange="searchFlat()">
                <label class="form-check-label fw-bold" for="radNumber">Search By Flat No</label>
            </div>
            <div class="col-md-6 text-center">
                <input class="form-check-input" type="radio" name="searchType" id="radName" onchange="searchFlatName()">
                <label class="form-check-label fw-bold" for="radName">Search By Flat Name</label>
            </div>
        </div>

        <div class="row align-items-center detail-row" id="row1" style="display:none;">
            <div class="col-md-4 text-end form-label">Flat No :</div>
            <div class="col-md-5">
                <input type="text" id="txtFlatNoSearch" class="form-control form-control-sm" maxlength="5" oninput="this.value = this.value.replace(/[^0-9]/g, '')" onchange="getFlatNoDetails()" />
            </div>
        </div>

        <div class="row align-items-center detail-row" id="row2" style="display:none;">
            <div class="col-md-4 text-end form-label">Flat Name :</div>
            <div class="col-md-6">
                <select id="cmbFlatName" class="form-select form-select-sm" onchange="getFlatNameDetails()">
                </select>
            </div>
        </div>

        <div id="detailsSection" style="display:none;">

            <div class="row align-items-center detail-row">
                <div class="col-md-4 text-end form-label">Branch Name :</div>
                <div class="col-md-8">
                    <input type="text" id="txtBranchName" class="form-control form-control-sm readonly-field" readonly />
                </div>
            </div>

            <div class="row align-items-center detail-row" id="row8">
                <div class="col-md-4 text-end form-label">Flat No :</div>
                <div class="col-md-8">
                    <input type="text" id="txtFlNoDisplay" class="form-control form-control-sm readonly-field" readonly />
                </div>
            </div>

            <div class="row align-items-center detail-row" id="row4">
                <div class="col-md-4 text-end form-label">Flat Name :</div>
                <div class="col-md-8">
                    <input type="text" id="txtFlatNameDisplay" class="form-control form-control-sm readonly-field" readonly />
                </div>
            </div>

            <div class="row align-items-center detail-row">
                <div class="col-md-4 text-end form-label">Owner Name :</div>
                <div class="col-md-8">
                    <input type="text" id="txtOwner" class="form-control form-control-sm readonly-field" readonly />
                </div>
            </div>

            <div class="row align-items-center detail-row">
                <div class="col-md-2 text-end form-label">Advance :</div>
                <div class="col-md-4">
                    <input type="text" id="txtAdvanceAmt" class="form-control form-control-sm readonly-field" readonly />
                </div>
                <div class="col-md-2 text-end form-label">Rent :</div>
                <div class="col-md-4">
                    <input type="text" id="txtRentAmt" class="form-control form-control-sm" />
                </div>
            </div>

            <div class="row align-items-center detail-row" id="row6">
                <div class="col-md-3 text-end form-label">Agreement From :</div>
                <div class="col-md-3">
                    <input type="text" id="txtFrom" class="form-control form-control-sm readonly-field" readonly />
                </div>
                <div class="col-md-3 text-end form-label">Agreement To :</div>
                <div class="col-md-3">
                    <input type="text" id="txtTo" class="form-control form-control-sm readonly-field" readonly />
                </div>
            </div>

            <div class="row align-items-center detail-row" id="row10">
                <div class="col-md-4 text-end form-label">Pending Days :</div>
                <div class="col-md-5">
                    <input type="text" id="txtPendDays" class="form-control form-control-sm readonly-field" readonly />
                </div>
            </div>

            <div class="row mt-4 mb-2">
                <div class="col-12 text-center">
                    <button type="button" class="btn btn-sm btn-dark fw-bold px-4 me-3" id="btnConfirm" onclick="btnConfirmOnclick()">CONFIRM</button>
                    <button type="button" class="btn btn-sm btn-danger fw-bold px-4" onclick="window.history.back()">EXIT</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        const root = '@ViewData["root"]';
        const usr_id = '@ViewData["EmpCode"]';
        const firmId = '@ViewData["FirmID"]';
        const branch_id = '@ViewData["BrID"]';

        function postApiUrl() {
            return window.location.hostname === "localhost"
                ? "/Others/postAPIData"
                : `/${root}/Others/postAPIData`.replace(/\/+/g, "/");
        }

        function stayInHostel() {
            if ($('#radProposal').is(':checked')) {
                $('#hidVal').val("1");
            } else if ($('#radHostel').is(':checked')) {
                $('#hidVal').val("2");
            }

            $('#rowSearch').show();
            $('#detailsSection').hide();
            $('#row1, #row2').hide();
            $('#radNumber, #radName').prop('checked', false);
        }

        function searchFlat() {
            $('#row1').show();
            $('#row2').hide();
            $('#detailsSection').hide();
            $('#txtFlatNoSearch').val("");
        }

        function searchFlatName() {
            $('#row1').hide();
            $('#row2').show();
            $('#detailsSection').hide();

            var optType = $('#hidVal').val();
            var reqData = "CANCEL_HOSTEL_FILL_COMBO^" + optType + "~" + firmId  + "^1";

            $.ajax({
                type: "POST",
                url: postApiUrl(),
                data: { datas: reqData },
                success: function (res) {
                    var data = typeof res === "string" ? JSON.parse(res) : res;
                    var $cmb = $('#cmbFlatName');
                    $cmb.empty();

                    if (data && data.length > 0) {
                        data.forEach(function (row) {
                            var vals = Object.values(row);
                            var val = vals[0];
                            var text = vals[1];
                            $cmb.append(`<option value="${val}">${text}</option>`);
                        });
                    } else {
                        Swal.fire("Info", "No Hostel to Cancel", "info");
                    }
                }
            });
        }

        function getFlatNoDetails() {
            var flatNo = $('#txtFlatNoSearch').val();
            if (flatNo === '') {
                Swal.fire("Warning", "Please ..Enter Flat No !!", "warning");
                return false;
            }

            var optType = $('#hidVal').val();
            var reqData = "CANCEL_HOSTEL_SEARCH_FLAT_NO^" + flatNo + "~" + optType + "~" + firmId  + "^1";

            executeSearch(reqData, optType, flatNo);
        }

        function getFlatNameDetails() {
            var flatNo = $('#cmbFlatName').val();
            if (flatNo == "-1" || !flatNo) {
                Swal.fire("Warning", "Please ..Select Flat Name !!", "warning");
                return false;
            }

            var optType = $('#hidVal').val();
            var reqData = "CANCEL_HOSTEL_SEARCH_FLAT_NAME^" + flatNo + "~" + optType + "~" + firmId  + "^1";

            executeSearch(reqData, optType, flatNo);
        }

        function executeSearch(reqData, optType, searchFlatNo) {
            $.ajax({
                type: "POST",
                url: postApiUrl(),
                data: { datas: reqData },
                success: function (res) {
                    var data = typeof res === "string" ? JSON.parse(res) : res;

                    if (data && data.length > 0) {
                        var row = data[0];

                        var flatName = Object.values(row)[0];
                        var flatNo = Object.values(row)[1];
                        var branchName = Object.values(row)[2];
                        var ownerName = Object.values(row)[3];
                        var advanceAmt = Object.values(row)[4];
                        var rentAmt = Object.values(row)[5];
                        var pendingDays = Object.values(row)[6];

                        $('#txtFlatNameDisplay').val(flatName);
                        $('#txtFlNoDisplay').val(flatNo);
                        $('#hidFlatNo').val(flatNo);
                        $('#txtBranchName').val(branchName);
                        $('#txtOwner').val(ownerName);
                        $('#txtAdvanceAmt').val(advanceAmt);
                        $('#txtRentAmt').val(rentAmt);

                        if (optType === "1") {
                            $('#row10').show();
                            $('#txtPendDays').val(pendingDays);
                            $('#row6').hide();
                        } else {
                            $('#row10').hide();
                            $('#row6').show();

                            var aggFrom = Object.values(row)[7];
                            var aggTo = Object.values(row)[8];

                            $('#txtFrom').val(aggFrom ? aggFrom.split('T')[0] : '');
                            $('#txtTo').val(aggTo ? aggTo.split('T')[0] : '');
                        }

                        if ($('#radNumber').is(':checked')) {
                            $('#row8').hide();
                            $('#row4').show();
                        } else {
                            $('#row8').show();
                            $('#row4').hide();
                        }

                        $('#detailsSection').show();
                    } else {
                        Swal.fire("Error", "Please ..Enter Correct Flat No !!", "error");
                        $('#detailsSection').hide();
                    }
                }
            });
        }

        function btnConfirmOnclick() {
            if (!$('#radProposal').is(':checked') && !$('#radHostel').is(':checked')) {
                Swal.fire("Warning", "Select Cancel Type", "warning");
                return false;
            }
            if (!$('#radNumber').is(':checked') && !$('#radName').is(':checked')) {
                Swal.fire("Warning", "Select Flat Type", "warning");
                return false;
            }
            if ($('#radName').is(':checked') && $('#cmbFlatName').val() == "-1") {
                Swal.fire("Warning", "Select Flat Name", "warning");
                return false;
            }
            if ($('#radNumber').is(':checked')) {
                var txtFlat = $('#txtFlatNoSearch').val();
                if (txtFlat === "" || txtFlat == "0") {
                    Swal.fire("Warning", "Enter Flat Number", "warning");
                    return false;
                }
            }

            var flatId = $('#hidFlatNo').val();
            var valOpt = $('#hidVal').val();

            Swal.fire({
                title: 'Are you sure?',
                text: "Do you want to confirm this cancellation?",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#3085d6',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Yes, Confirm!'
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire("Success", "Hostel Cancellation logged successfully. (Backend Execute Here)", "success")
                    .then(() => {
                        window.history.back();
                    });
                }
            });
        }
    </script>
</body>
</html>
